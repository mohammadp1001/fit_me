program:
  name: "برنامه بدنسازی بالاتنه — محمد پاکدامن"
  name_en: "Upper Body Hypertrophy Program — Mohammad Pakdaman"
  days:

    # ──────────────────────────────────────────────────────────────
    # روز اول — سینه و جلو بازو
    # Day 1 — Chest & Biceps
    # ──────────────────────────────────────────────────────────────
    - name: "روز اول — سینه و جلو بازو"
      name_en: "Day 1 — Chest & Biceps"
      exercises:

        # پرس سینه دستگاه — حرکت اصلی سینه
        - name: "Machine Chest Press"
          muscles: ["Pectoralis Major", "Triceps", "Anterior Deltoid"]
          sets: 4
          reps: [12, 10, 8, 8]
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Machine-machine-chest-press-side.mp4"
          description: "حرکت اصلی سینه با دستگاه؛ مسیر ثابت آن اجازه می‌دهد با تمرکز کامل روی سینه فشار بیاوری."
          description_en: "The primary chest press; the fixed path lets you push hard with full focus on the pecs."
          tips:
            - "کتف‌ها را عقب و پایین و ثابت روی صندلی نگه دار."
            - "دسته‌ها را هم‌راستای وسط سینه تنظیم کن."
          tips_en:
            - "Keep shoulder blades pulled back and down against the pad."
            - "Set the handles in line with mid-chest."
          mistakes:
            - "قفل‌کردن ناگهانی آرنج در انتهای حرکت."
          mistakes_en:
            - "Snapping the elbows into a hard lockout."

        # پرس بالا سینه دمبل — تاکید روی سینه بالایی
        - name: "Dumbbell Incline Bench Press"
          muscles: ["Upper Pectoralis Major", "Anterior Deltoid", "Triceps"]
          sets: 4
          reps: [12, 10, 8, 8]
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Dumbbells-dumbbell-incline-press-side.mp4"
          description: "پرس روی نیمکت شیب‌دار برای تاکید روی سینه بالایی و سرشانه جلویی."
          description_en: "An incline press biasing the upper chest and front delts."
          tips:
            - "شیب نیمکت را حدود ۳۰ درجه نگه دار."
            - "دمبل‌ها را تا کشش راحت سینه پایین ببر."
          tips_en:
            - "Keep the bench at about 30°."
            - "Lower until you feel a comfortable chest stretch."
          mistakes:
            - "شیب بیش از حد که فشار را به شانه منتقل می‌کند."
          mistakes_en:
            - "Too steep an incline, shifting load onto the shoulders."

        # باترفلای دستگاه — ایزوله کردن سینه
        - name: "Machine Pec Deck (Butterfly)"
          muscles: ["Pectoralis Major", "Inner Chest", "Anterior Deltoid"]
          sets: 3
          reps: 12
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Machine-machine-pec-deck-side.mp4"
          description: "حرکت ایزوله برای سینه با تمرکز روی انقباض در وسط."
          description_en: "A chest isolation focused on the squeeze at mid-line."
          tips:
            - "در انتهای حرکت یک لحظه انقباض را نگه دار."
            - "آرنج را کمی خم و ثابت نگه دار."
          tips_en:
            - "Hold the squeeze for a beat at the end."
            - "Keep a slight, fixed bend in the elbows."
          mistakes:
            - "پرتاب کردن دسته‌ها با حرکت پرشی."
          mistakes_en:
            - "Throwing the handles with momentum."

        # پرس زیر سینه سیم‌کش — تاکید روی سینه پایینی
        - name: "Cable Pec Fly (Low to High)"
          muscles: ["Lower Pectoralis Major", "Anterior Deltoid"]
          sets: 3
          reps: [12, 12, 10]
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Cables-cable-pec-fly-side.mp4"
          description: "فلای سیم‌کش از پایین به بالا برای تاکید روی سینه پایینی با کشش ثابت."
          description_en: "A low-to-high cable fly emphasizing the lower chest with constant tension."
          tips:
            - "دست‌ها را کمی بالای خط سینه به هم برسان."
            - "بالاتنه را کمی به جلو متمایل کن."
          tips_en:
            - "Bring the hands together just above chest line."
            - "Lean slightly forward from the hips."
          mistakes:
            - "خم و راست کردن زیاد آرنج مثل پرس."
          mistakes_en:
            - "Bending and pressing at the elbow like a press."

        # جلو بازو دستگاه (پریچر کرل)
        - name: "Machine Preacher Curl"
          muscles: ["Biceps Brachii", "Brachialis", "Brachioradialis"]
          sets: 4
          reps: [12, 10, 8, 8]
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Machine-machine-seated-plate-loaded-preacher-curl-side.mp4"
          description: "حرکت اصلی جلو بازو با تکیه‌گاه ثابت که تقلب را حذف می‌کند."
          description_en: "The primary biceps builder; the pad removes cheating so the arm does the work."
          tips:
            - "بازو را کامل روی بالشتک نگه دار."
            - "در پایین حرکت آرنج را کاملاً باز نکن تا کشش حفظ شود."
          tips_en:
            - "Keep the upper arm flat on the pad."
            - "Don't fully lock out at the bottom — keep tension."
          mistakes:
            - "بلند کردن آرنج از روی بالشتک."
          mistakes_en:
            - "Lifting the elbow off the pad."

        # جلو بازو سیم‌کش — کشش ثابت
        - name: "Cable Bar Curl"
          muscles: ["Biceps Brachii", "Brachialis"]
          sets: 3
          reps: [12, 10, 10]
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Cables-cable-bar-curl-side.mp4"
          description: "جلو بازو سیم‌کش با کشش پیوسته در کل دامنه حرکت."
          description_en: "A cable curl that keeps tension on the biceps through the whole range."
          tips:
            - "آرنج‌ها را کنار بدن ثابت نگه دار."
            - "پایین‌آوردن وزنه را کنترل‌شده انجام بده."
          tips_en:
            - "Pin the elbows at your sides."
            - "Lower the weight under control."
          mistakes:
            - "تاب دادن بالاتنه برای بالا بردن وزنه."
          mistakes_en:
            - "Swinging the torso to lift the weight."
          superset_with: "Cable Reverse Curl"

        # جلو بازو سیم‌کش مچ برعکس — تاکید روی ساعد
        - name: "Cable Reverse Curl"
          muscles: ["Brachioradialis", "Forearm", "Biceps Brachii"]
          sets: 2
          reps: 12
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Cables-cable-reverse-bicep-curl-side.mp4"
          description: "کرل مچ‌برعکس برای تقویت ساعد و عضله بازویی."
          description_en: "A reverse-grip curl targeting the forearms and brachialis."
          tips:
            - "مچ را صاف و ثابت نگه دار."
            - "با وزنه سبک‌تر روی فرم تمرکز کن."
          tips_en:
            - "Keep the wrists straight and firm."
            - "Use lighter weight and focus on form."
          mistakes:
            - "خم کردن مچ به سمت بالا."
          mistakes_en:
            - "Curling the wrist upward."
          superset_with: "Cable Bar Curl"

    # ──────────────────────────────────────────────────────────────
    # روز دوم — پشت و پشت بازو
    # Day 2 — Back & Triceps
    # ──────────────────────────────────────────────────────────────
    - name: "روز دوم — پشت و پشت بازو"
      name_en: "Day 2 — Back & Triceps"
      exercises:

        # لت دستگاه دست باز — عرض پشت
        - name: "Machine Lat Pulldown (Wide Grip)"
          muscles: ["Latissimus Dorsi", "Lower Trapezius", "Biceps", "Rear Deltoid"]
          sets: 4
          reps: [12, 10, 10, 8]
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Machine-machine-pulldown-side.mp4"
          description: "کشش از بالا با دست باز برای ساختن عرض پشت (لتیسیموس)."
          description_en: "A wide-grip pulldown that builds back width through the lats."
          tips:
            - "میله را به بالای سینه بکش و کتف‌ها را پایین بیاور."
            - "با آرنج‌ها هدایت کن، نه با دست‌ها."
          tips_en:
            - "Pull the bar to the upper chest, driving the shoulder blades down."
            - "Lead with the elbows, not the hands."
          mistakes:
            - "تاب دادن زیاد بالاتنه به عقب."
          mistakes_en:
            - "Leaning the torso back excessively."

        # زیر بغل دستگاه نشسته — ضخامت پشت
        - name: "Machine Seated Cable Row"
          muscles: ["Latissimus Dorsi", "Middle Trapezius", "Rhomboids", "Biceps"]
          sets: 4
          reps: [12, 10, 10, 8]
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Machine-machine-seated-cable-row-side.mp4"
          description: "پارویی نشسته برای ساختن ضخامت پشت و عضلات میانی کتف."
          description_en: "A seated row that builds back thickness and the mid-back muscles."
          tips:
            - "سینه را بالا و کمر را خنثی نگه دار."
            - "دسته را به سمت شکم بکش و کتف‌ها را جمع کن."
          tips_en:
            - "Keep the chest up and spine neutral."
            - "Pull to the stomach and squeeze the shoulder blades."
          mistakes:
            - "گرد کردن کمر در پایان کشش."
          mistakes_en:
            - "Rounding the lower back at the stretch."

        # لت سیم‌کش تک دست دست صاف — ایزوله کردن لت
        - name: "Cable Single Arm Pulldown (Straight Arm)"
          muscles: ["Latissimus Dorsi", "Serratus Anterior", "Rear Deltoid"]
          sets: 3
          reps: [12, 10, 10]
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Cables-cable-single-arm-pulldown-side.mp4"
          description: "پول‌داون دست‌صاف تک‌دست برای ایزوله کردن لتیسیموس بدون درگیری دو سر بازو."
          description_en: "A straight-arm single-arm pulldown that isolates the lats without biceps involvement."
          tips:
            - "آرنج را با خم بسیار کم ثابت نگه دار."
            - "روی کشیدن با پشت تمرکز کن نه با دست."
          tips_en:
            - "Keep a slight, fixed elbow bend."
            - "Drive the movement from the lat, not the hand."
          mistakes:
            - "تبدیل حرکت به پرس پشت بازو با خم کردن آرنج."
          mistakes_en:
            - "Bending the elbow so it becomes a triceps pushdown."

        # فلای معکوس دستگاه — تقویت شانه خلفی
        - name: "Machine Reverse Fly"
          muscles: ["Rear Deltoid", "Middle Trapezius", "Rhomboids"]
          sets: 3
          reps: 12
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Machine-machine-reverse-fly-side.mp4"
          description: "فلای معکوس برای تقویت شانه خلفی و بهبود تعادل عضلات کتف."
          description_en: "A reverse fly that strengthens the rear delts and balances the shoulder girdle."
          tips:
            - "با انقباض کتف‌ها حرکت را شروع کن."
            - "دامنه حرکت را کنترل‌شده نگه دار."
          tips_en:
            - "Initiate by squeezing the shoulder blades."
            - "Keep the range controlled."
          mistakes:
            - "استفاده از وزنه سنگین و درگیر کردن ذوزنقه."
          mistakes_en:
            - "Going too heavy and recruiting the traps."

        # پشت بازو سیم‌کش طنابی — حرکت اصلی پشت بازو
        - name: "Cable Rope Pushdown"
          muscles: ["Triceps Brachii", "Lateral Head", "Medial Head"]
          sets: 4
          reps: [15, 12, 12, 10]
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Cables-cable-rope-pushdown-side.mp4"
          description: "حرکت اصلی پشت بازو با طناب که در انتها امکان باز کردن دست‌ها و انقباض بیشتر می‌دهد."
          description_en: "The primary triceps move; the rope lets you spread the hands at the bottom for a stronger contraction."
          tips:
            - "آرنج‌ها را کنار بدن ثابت نگه دار."
            - "در پایین حرکت طناب را کمی از هم باز کن."
          tips_en:
            - "Keep the elbows pinned to your sides."
            - "Spread the rope apart at the bottom."
          mistakes:
            - "جلو و عقب رفتن آرنج‌ها هنگام حرکت."
          mistakes_en:
            - "Letting the elbows drift forward and back."

        # پشت بازو دستگاه — ایزوله با آرنج ثابت
        - name: "Machine Tricep Pushdown"
          muscles: ["Triceps Brachii", "Long Head", "Lateral Head"]
          sets: 3
          reps: [12, 12, 10]
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Machine-machine-tricep-pushdown-side.mp4"
          description: "پشت بازو دستگاه با مسیر ثابت و آرنج تثبیت‌شده برای ایزوله دقیق."
          description_en: "A machine pushdown with a fixed path and stabilized elbow for clean isolation."
          tips:
            - "بالاتنه را صاف و ثابت نگه دار."
            - "در انتها پشت بازو را کامل منقبض کن."
          tips_en:
            - "Keep the torso upright and still."
            - "Fully contract the triceps at the end."
          mistakes:
            - "کمک گرفتن از وزن بدن با خم شدن."
          mistakes_en:
            - "Leaning in to push with body weight."
          superset_with: "Dumbbell Skull Crusher"

        # پشت بازو دمبل خوابیده — تاکید روی سر بلند
        - name: "Dumbbell Skull Crusher"
          muscles: ["Triceps Brachii", "Long Head", "Medial Head"]
          sets: 3
          reps: [12, 10, 10]
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Dumbbells-dumbbell-skull-crusher-side.mp4"
          description: "پشت بازو خوابیده با دمبل که سر بلند عضله را با کشش بیشتر هدف می‌گیرد."
          description_en: "A lying dumbbell extension that loads the long head of the triceps in a stretched position."
          tips:
            - "بازوها را عمود بر زمین و ثابت نگه دار."
            - "دمبل‌ها را تا کنار گوش پایین ببر."
          tips_en:
            - "Keep the upper arms vertical and still."
            - "Lower the dumbbells beside the ears."
          mistakes:
            - "حرکت دادن آرنج‌ها به سمت جلو."
          mistakes_en:
            - "Letting the elbows travel forward."
          superset_with: "Machine Tricep Pushdown"

    # ──────────────────────────────────────────────────────────────
    # روز سوم — شانه و بازو
    # Day 3 — Shoulders & Arms
    # ──────────────────────────────────────────────────────────────
    - name: "روز سوم — شانه و بازو"
      name_en: "Day 3 — Shoulders & Arms"
      exercises:

        # پرس سرشانه دستگاه — حرکت اصلی شانه
        - name: "Machine Shoulder Press"
          muscles: ["Anterior Deltoid", "Lateral Deltoid", "Triceps"]
          sets: 4
          reps: [12, 11, 10, 8]
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Machine-machine-overhand-overhead-press-side.mp4"
          description: "پرس سرشانه با دستگاه؛ حرکت اصلی برای حجم و قدرت دلتوئید."
          description_en: "The primary shoulder press for delt size and strength."
          tips:
            - "کمر را به پشتی صندلی بچسبان."
            - "دسته‌ها را تا کشش راحت شانه پایین بیاور."
          tips_en:
            - "Keep the lower back against the pad."
            - "Lower to a comfortable shoulder stretch."
          mistakes:
            - "قفل کردن ناگهانی آرنج در بالا."
          mistakes_en:
            - "Snapping into a hard lockout at the top."

        # سرشانه نشر جانب دمبل — عرض شانه
        - name: "Dumbbell Lateral Raise"
          muscles: ["Lateral Deltoid", "Anterior Deltoid", "Upper Trapezius"]
          sets: 4
          reps: [15, 12, 12, 12]
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Dumbbells-dumbbell-lateral-raise-side.mp4"
          description: "نشر جانب برای ساختن عرض شانه از طریق دلتوئید میانی."
          description_en: "A lateral raise that builds shoulder width via the side delts."
          tips:
            - "با آرنج هدایت کن و خم کوچکی در آن نگه دار."
            - "تا هم‌راستای شانه بالا بیاور، نه بالاتر."
          tips_en:
            - "Lead with the elbow, keeping a slight bend."
            - "Raise to shoulder height, not higher."
          mistakes:
            - "استفاده از تاب بدن برای پرتاب دمبل‌ها."
          mistakes_en:
            - "Using body swing to heave the dumbbells."
          superset_with: "Cable Low Single Arm Lateral Raise"

        # سرشانه نشر جانب سیم‌کش تک دست
        - name: "Cable Low Single Arm Lateral Raise"
          muscles: ["Lateral Deltoid", "Supraspinatus"]
          sets: 3
          reps: [15, 12, 12]
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Cables-cable-low-single-arm-lateral-raise-side.mp4"
          description: "نشر جانب سیم‌کش تک‌دست که در پایین حرکت کشش ثابت روی دلتوئید میانی نگه می‌دارد."
          description_en: "A single-arm cable raise that keeps constant tension on the side delt at the bottom."
          tips:
            - "کمی از دستگاه فاصله بگیر تا کشش بهتر شود."
            - "بالاتنه را ثابت نگه دار."
          tips_en:
            - "Stand a step away from the stack for better tension."
            - "Keep the torso still."
          mistakes:
            - "چرخاندن بدن برای کمک به بالا بردن دست."
          mistakes_en:
            - "Twisting the body to assist the raise."
          superset_with: "Dumbbell Lateral Raise"

        # سرشانه نشر از جلو دمبل — تاکید روی دلتوئید جلو
        - name: "Dumbbell Front Raise"
          muscles: ["Anterior Deltoid", "Upper Pectoralis Major"]
          sets: 3
          reps: 12
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Dumbbells-dumbbell-front-raise-side.mp4"
          description: "نشر از جلو برای تاکید روی دلتوئید قدامی."
          description_en: "A front raise emphasizing the anterior delts."
          tips:
            - "دمبل را تا هم‌راستای شانه بالا بیاور."
            - "حرکت را کنترل‌شده پایین بیاور."
          tips_en:
            - "Raise to shoulder height."
            - "Lower under control."
          mistakes:
            - "تاب دادن بالاتنه به عقب."
          mistakes_en:
            - "Leaning back and swinging the weight up."

        # شراگز دمبل — تقویت ذوزنقه بالایی
        - name: "Dumbbell Shrug"
          muscles: ["Upper Trapezius", "Levator Scapulae"]
          sets: 3
          reps: 12
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Dumbbells-dumbbell-shrug-side.mp4"
          description: "شراگز برای تقویت ذوزنقه بالایی با بالا کشیدن مستقیم شانه‌ها."
          description_en: "A shrug that builds the upper traps by lifting the shoulders straight up."
          tips:
            - "شانه‌ها را مستقیم به سمت گوش بالا بکش."
            - "در بالای حرکت یک لحظه نگه دار."
          tips_en:
            - "Lift the shoulders straight toward the ears."
            - "Pause briefly at the top."
          mistakes:
            - "چرخاندن شانه‌ها به صورت دایره‌ای."
          mistakes_en:
            - "Rolling the shoulders in circles."

        # جلو بازو دمبل بالا سینه — کشش سر بلند دو سر بازو
        - name: "Dumbbell Incline Bicep Curl"
          muscles: ["Biceps Brachii", "Long Head", "Brachialis"]
          sets: 3
          reps: [12, 10, 10]
          video: "https://media.musclewiki.com/media/uploads/videos/branded/male-Dumbbells-dumbbell-incline-bicep-curl-side.mp4"
          description: "کرل روی نیمکت شیب‌دار که با کشیده شدن بازو به عقب، سر بلند دو سر بازو را هدف می‌گیرد."
          description_en: "An incline curl that stretches the long head of the biceps by keeping the arm behind the body."
          tips:
            - "بازوها را عمود و آویزان از شانه نگه دار."
            - "در پایین حرکت کشش کامل را حس کن."
          tips_en:
            - "Let the arms hang straight down from the shoulders."
            - "Feel a full stretch at the bottom."
          mistakes:
            - "جلو آوردن آرنج‌ها هنگام کرل."
          mistakes_en:
            - "Bringing the elbows forward during the curl."

        # جلو بازو دستگاه — تاکید روی سر کوتاه (تکرار از روز اول؛ راهنما از کتابخانه می‌آید)
        - name: "Machine Preacher Curl"
          muscles: ["Biceps Brachii", "Short Head", "Brachialis"]
          sets: 3
          reps: [12, 10, 10]
