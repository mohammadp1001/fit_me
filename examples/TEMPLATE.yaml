# ============================================================================
# FitMe program schema — annotated template
# ----------------------------------------------------------------------------
# Feed this file (or one shaped like it) to Profile → "Upload new program".
# Everything the parser understands is documented below. Any key not listed
# here is REJECTED, so the file cannot quietly carry something ignored.
#
# A program says which exercise, how many sets, and what reps. Nothing else.
#
# What an exercise IS — its muscles, description, tips, common mistakes and
# video — lives in the shared exercise catalog, not in this file. That is
# deliberate: those values used to be restated on every upload and written
# straight over the stored exercise, so one sloppy file could silently re-tag a
# lift and corrupt the weekly volume numbers.
#
# Quick rules:
#   • The whole file is a single top-level `program:` object.
#   • Names are English. The app's interface is still bilingual, but exercise
#     and program content is not.
#   • `exercise:` is a SLUG, not a display name — lowercase, digits and
#     underscores, e.g. `barbell_squat`. Call `list_exercises` (or look in the
#     app's library) to find the right one. An unknown slug fails the upload
#     and the error lists near-matches; nothing is guessed.
#   • `sets` is a positive integer.
#   • `reps` is EITHER one integer (same target for every set)
#            OR a list of integers, one per set.
#   • `superset_with` links two exercises: put the partner's exact slug on
#     BOTH exercises so the app pairs them.
#   • `note` is optional — your reasoning for this prescription. It is shown
#     with the program. It is NOT the user's note; that one is written at the
#     gym, per session, on the log screen.
#
# ----------------------------------------------------------------------------
# Weekly volume is counted per muscle GROUP, from the catalog's tags:
#
#   chest · back · shoulders · arms · forearms
#   quads · hamstrings · glutes · adductors · calves · core
#
# A logged set counts fully toward every primary muscle's group and half toward
# every secondary one. You do not tag anything here — the catalog already has.
#
# To add an exercise the catalog does not carry, use the `add_exercise` tool.
# It lands in your own library only, and gets a slug you can reference here.
# ============================================================================

program:
  name: "Sample Program"                  # required

  days:                                   # required — one or more training days
    # ────────────────────────────────────────────────────────────────
    - name: "Day 1 — Chest"               # required
      exercises:                          # required — one or more exercises

        # Minimal exercise: one rep target for every set.
        - exercise: machine_chest_press    # required — catalog slug
          sets: 4                          # required — positive integer
          reps: 10                         # one number → 10 reps every set

        # Per-set reps, plus the coach's reasoning.
        - exercise: incline_dumbbell_press
          sets: 4
          reps: [12, 10, 8, 8]             # one entry per set (pyramid)
          note: "Pyramid up. Stop one rep short of failure on the last set."

        # A superset pair — BOTH exercises reference each other by slug.
        - exercise: cable_crossover
          sets: 3
          reps: [12, 12, 10]
          superset_with: pushups
        - exercise: pushups
          sets: 3
          reps: 15
          superset_with: cable_crossover

    # ────────────────────────────────────────────────────────────────
    - name: "Day 2 — Back"
      exercises:
        - exercise: wide_grip_lat_pulldown
          sets: 4
          reps: [12, 10, 10, 8]
          note: "Lead with the elbows. Add weight when all four sets hit the target."
