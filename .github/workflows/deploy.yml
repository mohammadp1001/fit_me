name: Deploy (Production)

# Production CD: cutting a release tag deploys that commit to Vercel prod.
# Tags live under `releases/**` (protected by the "release" ruleset), so only
# a maintainer can trigger a production deploy.
on:
  push:
    tags:
      - "releases/**"

# Never run two production deploys at once; let an in-flight one finish.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Deploy by uploading the source and letting Vercel build it on their
      # infrastructure. This is deliberate: the build command runs `prisma db
      # push`, which needs the real Production env vars (DATABASE_URL, etc.).
      # Those are marked sensitive in Vercel and cannot be read back onto the
      # runner via `vercel pull`, so a local `--prebuilt` build fails. Building
      # remotely resolves them the same way the dashboard deploy does.
      - name: Deploy to production
        id: deploy
        run: |
          url=$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ${GITHUB_REF_NAME} -> $url"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
