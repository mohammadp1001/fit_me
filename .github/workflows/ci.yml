name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: johndoe
          POSTGRES_PASSWORD: randompassword
          POSTGRES_DB: fitme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://johndoe:randompassword@localhost:5432/fitme?schema=public
      DIRECT_URL: postgresql://johndoe:randompassword@localhost:5432/fitme?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 22+ is required for `--experimental-strip-types`, which the seed
          # scripts run on. The repo already assumed it (`db:seed` uses the same
          # flag); CI simply never executed one of those scripts until now.
          node-version: 22
          cache: npm

      # Use `npm install` rather than `npm ci`: the committed lockfile is
      # generated on Windows and can't express the Linux-only optional native
      # deps (e.g. Tailwind oxide / @emnapi) that `npm ci` demands on the
      # Ubuntu runner. `install` resolves per-platform and still runs the
      # `postinstall` -> `prisma generate` hook.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # The Postgres service container is empty - apply migrations so DB
      # round-trip tests (e.g. prisma/suggestion-memory.test.ts) have a schema
      # to write to.
      - name: Apply migrations
        run: npx prisma migrate deploy

      # The shared exercise catalog is reference data, not schema, so migrating
      # does not create it. Seeding is idempotent and cheap.
      - name: Seed exercise catalog
        run: npm run db:seed-catalog

      - name: Test
        run: npm test

      # The app is fully dynamic (auth redirect), so no DB is hit at build
      # time - DATABASE_URL/DIRECT_URL from the job env just satisfy
      # client/config instantiation.
      - name: Build
        run: npm run build
        env:
          SESSION_SECRET: ci-placeholder-session-secret-32chars
          APP_PASSPHRASE: ci-placeholder
