name: Release

# Manually cut a release: bump the version, push a release branch, and open a
# PR into main. After that PR merges, tag the merge commit `releases/vX.Y.Z`
# (see the PR body) to trigger the production deploy.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write # push the release branch
  pull-requests: write # open the release PR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          version=$(npm version "${{ inputs.bump }}" --no-git-tag-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=release/$version" >> "$GITHUB_OUTPUT"

      - name: Push release branch
        run: |
          git switch -c "${{ steps.bump.outputs.branch }}"
          git commit -am "chore(release): ${{ steps.bump.outputs.version }}"
          git push origin "${{ steps.bump.outputs.branch }}"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.bump.outputs.branch }}" \
            --title "Release ${{ steps.bump.outputs.version }}" \
            --body "$(cat <<'BODY'
          Automated version bump to ${{ steps.bump.outputs.version }}.

          **To ship after merging this PR**, cut the release tag on main:

          ```bash
          git checkout main && git pull
          git tag releases/${{ steps.bump.outputs.version }}
          git push origin releases/${{ steps.bump.outputs.version }}
          ```

          That tag triggers the **Deploy (Production)** workflow, which builds and
          deploys to Vercel and publishes the GitHub Release.
          BODY
          )"
